[project]
name = "cobedit"
version = "0.1.0"
description = "Tkinter editor for .cob.json files: view geometry, place PCB pads"
readme = "README.md"
requires-python = ">=3.11"
license = "CC-BY-4.0"
authors = [{ name = "Stephan Bökelmann" }]
dependencies = ["cobviz", "cobkicad"]

[project.scripts]
cobedit = "cobedit.app:main"

[tool.uv.sources]
cobviz = { path = "../cobviz", editable = true }
cobkicad = { path = "../cobkicad", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cobedit"]
