[project]
name = "cobtestdata"
version = "0.1.0"
description = "Fetch wafer.space reticle layouts and split them into per-chip OASIS files for testing cobgen"
readme = "README.md"
requires-python = ">=3.11"
license = "CC-BY-4.0"
authors = [{ name = "Stephan Bökelmann" }]
dependencies = ["gdstk>=0.9"]

[project.scripts]
initialize_testdata = "cobtestdata.cli:main"
extract_die = "cobtestdata.extract_die:main"
cobclean = "cobtestdata.clean:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cobtestdata"]
