[project]
name = "cobviz"
version = "0.1.0"
description = "Render a .cob.json file as an SVG"
readme = "README.md"
requires-python = ">=3.11"
license = "CC-BY-4.0"
authors = [{ name = "Stephan Bökelmann" }]
dependencies = []

[project.scripts]
cobviz = "cobviz.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cobviz"]
